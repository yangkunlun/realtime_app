<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时语音通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a; color: #e2e8f0;
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
}
#app {
  width: 100%; max-width: 500px; padding: 24px;
}
h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; color: #f1f5f9; }
#status-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px; font-size: 0.9rem; color: #94a3b8;
}
#status-dot {
  width: 10px; height: 10px; border-radius: 50%; background: #475569;
  flex-shrink: 0;
}
#status-dot.connected { background: #22c55e; }
#status-dot.calling { background: #3b82f6; animation: pulse 1.5s infinite; }
#status-dot.error { background: #ef4444; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
#btn-row {
  display: flex; gap: 12px; margin-bottom: 20px;
}
#call-btn {
  flex: 1; padding: 16px; border: none; border-radius: 12px;
  font-size: 1.1rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
#call-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#call-btn.start { background: #22c55e; color: #fff; }
#call-btn.start:hover:not(:disabled) { background: #16a34a; }
#call-btn.stop { background: #ef4444; color: #fff; }
#call-btn.stop:hover:not(:disabled) { background: #dc2626; }
#replay-btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: #1e293b; color: #94a3b8; font-size: 1rem;
  cursor: pointer; transition: all 0.2s; margin-top: 12px;
}
#replay-btn:disabled { opacity: 0.3; cursor: not-allowed; }
#replay-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; }
#replay-btn.playing { background: #f59e0b; color: #fff; }
#chat {
  margin-top: 0; padding: 16px; border-radius: 8px;
  background: #1e293b; min-height: 200px; max-height: 400px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}
.msg {
  max-width: 80%; padding: 10px 14px; border-radius: 12px;
  font-size: 0.9rem; line-height: 1.5; word-break: break-word;
}
.msg.ai {
  align-self: flex-start;
  background: #334155; color: #e2e8f0;
  border-bottom-left-radius: 4px;
}
.msg.user {
  align-self: flex-end;
  background: #1d4ed8; color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-label {
  font-size: 0.7rem; color: #64748b; margin-bottom: 2px;
}
.msg.ai .msg-label { color: #94a3b8; }
.msg.user .msg-label { color: #93c5fd; }
.msg.system {
  align-self: center;
  background: transparent; color: #64748b;
  font-size: 0.8rem; text-align: center;
}
</style>
</head>
<body>
<div id="app">
  <h1>实时语音通话</h1>
  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
  <div id="btn-row">
    <button id="call-btn" class="start" disabled>开始通话</button>
  </div>
  <div id="chat"></div>
  <button id="replay-btn" disabled>回放</button>
</div>

<script>
const PLAYBACK_BUFFER_SIZE = 24000 * 3;
let ws = null;
let audioContext = null;
let micStream = null;
let processor = null;
let playbackContext = null;
let playbackProcessor = null;
let isCalling = false;
let recordingUrl = null;
let replayAudio = null;
let isReplaying = false;

let pbBuffer = new Int16Array(PLAYBACK_BUFFER_SIZE);
let pbWritePos = 0;
let pbReadPos = 0;

const callBtn = document.getElementById('call-btn');
const replayBtn = document.getElementById('replay-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const chatEl = document.getElementById('chat');

// --- WebSocket ---
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('connected', 'Connected');
  ws.onclose = () => { setStatus('', 'Disconnected'); stopCall(); };
  ws.onerror = () => setStatus('error', 'Connection error');
  ws.onmessage = handleMessage;
}

function handleMessage(event) {
  if (event.data instanceof ArrayBuffer) {
    const view = new DataView(event.data);
    const type = view.getUint8(0);
    const data = event.data.slice(1);
    if (type === 0x01) enqueueAudio(new Int16Array(data));
  } else {
    const msg = JSON.parse(event.data);
    if (msg.type === 'status') setStatus(msg.status, msg.message);
    if (msg.type === 'audio_info') initPlayback();
    if (msg.type === 'chat') addChat(msg.role, msg.text);
    if (msg.type === 'recording') {
      recordingUrl = '/' + msg.filename;
      replayBtn.disabled = false;
      addSystem('Recording saved');
    }
  }
}

// --- Status ---
function setStatus(status, text) {
  statusDot.className = status;
  statusText.textContent = text;
  if (status === 'connected') {
    callBtn.disabled = false;
    callBtn.className = 'start';
    callBtn.textContent = '开始通话';
  } else if (status === 'calling') {
    callBtn.className = 'stop';
    callBtn.textContent = '结束通话';
    callBtn.disabled = false;
  } else {
    callBtn.disabled = true;
  }
}

// --- Chat display ---
function addChat(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Zhang Jie';
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(label);
  div.appendChild(body);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addSystem(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// --- Call control ---
callBtn.addEventListener('click', () => {
  if (isCalling) stopCall();
  else startCall();
});

async function startCall() {
  isCalling = true;
  recordingUrl = null;
  replayBtn.disabled = true;
  try {
    audioContext = new AudioContext({ sampleRate: 16000 });
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const source = audioContext.createMediaStreamSource(micStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = (e) => {
      if (!isCalling || ws.readyState !== WebSocket.OPEN) return;
      const float32 = e.inputBuffer.getChannelData(0);
      ws.send(float32ToInt16(float32).buffer);
    };
    source.connect(processor);
    processor.connect(audioContext.destination);
    ws.send(JSON.stringify({ type: 'start' }));
    addSystem('--- Call started ---');
  } catch (err) {
    addSystem('Mic error: ' + err.message);
    stopCall();
  }
}

function stopCall() {
  isCalling = false;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop' }));
  }
  if (processor) { processor.disconnect(); processor = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  addSystem('--- Call ended ---');
}

// --- Replay recording ---
replayBtn.addEventListener('click', () => {
  if (!recordingUrl) return;
  if (isReplaying) {
    stopReplay();
  } else {
    startReplay();
  }
});

function startReplay() {
  if (!playbackContext) {
    playbackContext = new AudioContext({ sampleRate: 24000 });
  }
  if (playbackContext.state === 'suspended') playbackContext.resume();

  replayAudio = new Audio(recordingUrl);
  replayAudio.onended = () => stopReplay();
  replayAudio.play();
  isReplaying = true;
  replayBtn.classList.add('playing');
  replayBtn.innerHTML = '&#9646;&#9646;';
  addSystem('--- Playing recording ---');
}

function stopReplay() {
  if (replayAudio) {
    replayAudio.pause();
    replayAudio.currentTime = 0;
    replayAudio = null;
  }
  isReplaying = false;
  replayBtn.classList.remove('playing');
  replayBtn.innerHTML = '&#9654;';
}

// --- Live playback ---
function initPlayback() {
  if (playbackContext) return;
  playbackContext = new AudioContext({ sampleRate: 24000 });
  playbackProcessor = playbackContext.createScriptProcessor(2048, 0, 1);
  playbackProcessor.onaudioprocess = (e) => {
    const output = e.outputBuffer.getChannelData(0);
    for (let i = 0; i < output.length; i++) {
      if (pbReadPos !== pbWritePos) {
        output[i] = pbBuffer[pbReadPos] / 32768.0;
        pbReadPos = (pbReadPos + 1) % PLAYBACK_BUFFER_SIZE;
      } else {
        output[i] = 0;
      }
    }
  };
  playbackProcessor.connect(playbackContext.destination);
}

function enqueueAudio(int16Array) {
  if (!playbackContext) initPlayback();
  if (playbackContext.state === 'suspended') playbackContext.resume();
  for (let i = 0; i < int16Array.length; i++) {
    pbBuffer[pbWritePos] = int16Array[i];
    pbWritePos = (pbWritePos + 1) % PLAYBACK_BUFFER_SIZE;
  }
}

// --- Audio conversion ---
function float32ToInt16(float32) {
  const int16 = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return int16;
}

// --- Init ---
connect();
</script>
</body>
</html>
